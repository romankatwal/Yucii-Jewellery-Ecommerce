
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yucii - Shopping Cart</title>

    <link rel="stylesheet" href="./assets/css/style.css">

    <style>
        .cart-page {
            padding: 50px 8%;
            min-height: 70vh;
            background: #f8f8f4;
            color: #183629;
        }

        .cart-title {
            font-family: "Cormorant Garamond", serif;
            font-size: 40px;
            margin: 0 0 30px;
        }

        .cart-container {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 330px;
            gap: 30px;
            align-items: start;
        }

        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 22px;
            padding: 20px;
            background: white;
            border: 1px solid #e5e5dc;
            border-radius: 6px;
        }

        .cart-item img {
            width: 130px;
            height: 130px;
            object-fit: cover;
            background: #f1f1eb;
            border-radius: 4px;
        }

        .cart-item-info {
            flex: 1;
            min-width: 0;
        }

        .cart-item-name {
            font-family: "Cormorant Garamond", serif;
            font-size: 25px;
            margin: 0 0 10px;
        }

        .cart-item-price {
            font-weight: 600;
            margin-bottom: 12px;
        }

        .cart-line-total {
            margin: 10px 0 0;
            font-size: 14px;
            color: #536d55;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
        }

        .quantity-controls button {
            width: 36px;
            height: 36px;
            border: 1px solid #d8d8cc;
            background: #f8f8f4;
            color: #183629;
            font-size: 18px;
            cursor: pointer;
        }

        .quantity-controls button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .quantity-controls span {
            width: 42px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 1px solid #d8d8cc;
            border-bottom: 1px solid #d8d8cc;
            background: white;
        }

        .remove-btn {
            margin-top: 12px;
            padding: 0;
            border: none;
            background: transparent;
            color: #a33b35;
            text-decoration: underline;
            cursor: pointer;
        }

        .cart-summary {
            position: sticky;
            top: 20px;
            padding: 25px;
            background: white;
            border: 1px solid #e5e5dc;
            border-radius: 6px;
        }

        .cart-summary h2 {
            font-family: "Cormorant Garamond", serif;
            font-size: 28px;
            margin: 0 0 22px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin: 17px 0;
        }

        .total-row {
            padding-top: 18px;
            border-top: 1px solid #e5e5dc;
            font-size: 19px;
            font-weight: bold;
        }

        .checkout-btn {
            width: 100%;
            padding: 15px;
            margin-top: 18px;
            border: none;
            background: #183629;
            color: white;
            font-size: 13px;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .checkout-btn:hover {
            background: #9a9a7b;
            color: #183629;
        }

        .empty-cart {
            padding: 60px 20px;
            text-align: center;
            background: white;
            border: 1px solid #e5e5dc;
        }

        .empty-cart p {
            font-family: "Cormorant Garamond", serif;
            font-size: 27px;
        }

        .continue-shopping {
            display: inline-block;
            margin-top: 15px;
            padding: 13px 22px;
            background: #183629;
            color: white;
            text-decoration: none;
        }

        .continue-shopping:hover {
            background: #9a9a7b;
            color: #183629;
        }

        .cart-message {
            padding: 20px;
            background: white;
            border: 1px solid #e5e5dc;
        }

        @media (max-width: 850px) {
            .cart-container {
                grid-template-columns: 1fr;
            }

            .cart-summary {
                position: static;
            }
        }

        @media (max-width: 550px) {
            .cart-page {
                padding: 30px 5%;
            }

            .cart-title {
                font-size: 32px;
            }

            .cart-item {
                align-items: flex-start;
                gap: 14px;
                padding: 12px;
            }

            .cart-item img {
                width: 95px;
                height: 110px;
            }

            .cart-item-name {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <main class="cart-page">

        <h1 class="cart-title">Shopping Cart</h1>

        <div id="cart-content">
            <p>Loading your cart...</p>
        </div>

    </main>

    <script src="./assets/js/cart.js"></script>

</body>
</html>
