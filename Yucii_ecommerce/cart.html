<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Yucii - Shopping Cart</title>

    <link rel="stylesheet"
          href="./assets/css/style.css">

    <style>

        .cart-page {
            padding: 60px 8%;
            min-height: 70vh;
        }

        .cart-title {
            font-size: 32px;
            margin-bottom: 30px;
        }

        .cart-container {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 40px;
            align-items: start;
        }

        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .cart-item {
            display: flex;
            gap: 20px;
            padding: 20px;
            border: 1px solid #ddd;
            background: #fff;
        }

        .cart-item img {
            width: 120px;
            height: 120px;
            object-fit: cover;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .cart-item-price {
            font-weight: bold;
            margin-bottom: 15px;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 0;
        }

        .quantity-controls button {
            width: 35px;
            height: 35px;
            border: 1px solid #ccc;
            background: #f5f5f5;
            cursor: pointer;
        }

        .quantity-controls span {
            width: 40px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 1px solid #ccc;
            border-bottom: 1px solid #ccc;
        }

        .remove-btn {
            margin-top: 12px;
            border: none;
            background: none;
            color: #c0392b;
            cursor: pointer;
        }

        .cart-summary {
            border: 1px solid #ddd;
            padding: 25px;
            background: #fff;
        }

        .cart-summary h2 {
            margin-bottom: 25px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
        }

        .total-row {
            font-size: 20px;
            font-weight: bold;
            border-top: 1px solid #ddd;
            padding-top: 20px;
        }

        .checkout-btn {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            border: none;
            background: #0d2b20;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .empty-cart {
            text-align: center;
            padding: 60px 20px;
            font-size: 20px;
        }

        .continue-shopping {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #9a9a7b;
            color: white;
            text-decoration: none;
        }

        @media (max-width: 768px) {

            .cart-container {
                grid-template-columns: 1fr;
            }

            .cart-item {
                flex-direction: column;
            }

            .cart-item img {
                width: 100%;
                height: 220px;
            }

        }

    </style>

</head>


<body>

    <main class="cart-page">

        <h1 class="cart-title">
            Shopping Cart
        </h1>


        <div id="cart-content">

            <!-- Cart items will appear here -->

        </div>

    </main>


    <script src="./assets/js/cart.js"></script>

</body>

</html>
