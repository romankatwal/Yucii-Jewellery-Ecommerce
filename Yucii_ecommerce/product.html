<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Yucii - Product</title>

    <link rel="stylesheet"
          href="./assets/css/style-prefix.css">

    <!-- Product Page CSS -->
    <link rel="stylesheet"
          href="./assets/css/product.css">

</head>


<body>


    <main>

        <!-- =================================
             PRODUCT PAGE
        ================================== -->

        <div class="product-container">


            <!-- =================================
                 LEFT SIDE - PRODUCT IMAGE
            ================================== -->

            <div class="product-gallery">


                <!-- Thumbnails -->

                <div class="thumbnail-list">

                    <img
                        src="./assets/images/products/Necklace-1.jpg"
                        alt="Product"
                    >

                </div>


                <!-- Main Image -->

                <div class="main-image">

                    <img
                        id="product-image"
                        src="./assets/images/products/Necklace-1.jpg"
                        alt="Product"
                    >

                </div>

            </div>



            <!-- =================================
                 RIGHT SIDE - PRODUCT INFORMATION
            ================================== -->

            <div class="product-info">


                <!-- Category -->

                <p
                    id="product-category"
                    class="product-category"
                >
                    Loading...
                </p>


                <!-- Product Name -->

                <h1
                    id="product-name"
                    class="product-name"
                >
                    Loading product...
                </h1>


                <!-- Rating -->

                <div class="rating">

                    ⭐⭐⭐⭐⭐

                    <span>4.5</span>

                </div>


                <hr>


                <!-- Price -->

                <h2
                    id="product-price"
                    class="product-price"
                >
                    Loading...
                </h2>


                <p class="tax">
                    Inclusive of all taxes
                </p>


                <!-- Description -->

                <p
                    id="product-description"
                    class="product-description"
                >
                    Loading product description...
                </p>


                <!-- Stock -->

                <p class="product-stock">

                    Stock:

                    <span id="product-stock">
                        Loading...
                    </span>

                </p>


                <!-- =================================
                     DELIVERY
                ================================== -->

                <div class="delivery-box">

                    <strong>
                        Delivery
                    </strong>

                    <p>
                        Enter your location to check delivery
                    </p>

                </div>



                <!-- =================================
                     QUANTITY
                ================================== -->

                <div class="quantity">

                    <button id="decrease-btn">
                        −
                    </button>

                    <span id="quantity">
                        1
                    </span>

                    <button id="increase-btn">
                        +
                    </button>

                </div>



                <!-- =================================
                     BUTTONS
                ================================== -->

                <div class="product-buttons">

                    <button class="add-cart-btn">
                        ADD TO CART
                    </button>

                    <button class="buy-now-btn">
                        BUY NOW
                    </button>

                </div>


            </div>

        </div>



        <!-- =================================
             PRODUCT DETAILS
        ================================== -->

        <section class="product-details">

            <h2>
                Product Details
            </h2>

            <p>
                This beautiful jewellery piece is
                designed for weddings and special
                occasions.
            </p>

        </section>


    </main>



    <!-- =================================
         JAVASCRIPT
    ================================== -->

    <script src="./assets/js/product.js"></script>


</body>

</html>
