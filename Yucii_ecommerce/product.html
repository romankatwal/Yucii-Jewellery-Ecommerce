<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yucii - Product</title>

    <link rel="stylesheet" href="./assets/css/style-prefix.css">
</head>

<body>

    <main>

        <section class="product-page">

            <div class="container">

                <div class="product-detail">

                    <div class="product-image-section">
                        <img
                            id="product-image"
                            src="./assets/images/products/Necklace-1.jpg"
                            alt="Product"
                        >
                    </div>

                    <div class="product-info">

                        <p id="product-category" class="product-category">
                            Loading...
                        </p>

                        <h1 id="product-name" class="product-name">
                            Loading product...
                        </h1>

                        <p id="product-price" class="product-price">
                            Loading...
                        </p>

                        <p id="product-description" class="product-description">
                            Loading product description...
                        </p>

                        <p class="product-stock">
                            Stock:
                            <span id="product-stock">Loading...</span>
                        </p>

                        <div class="quantity">

                            <button id="decrease-btn">−</button>

                            <span id="quantity">1</span>

                            <button id="increase-btn">+</button>

                        </div>

                        <button class="add-cart-btn">
                            Add to Cart
                        </button>

                        <button class="buy-now-btn">
                            Buy Now
                        </button>

                    </div>

                </div>

            </div>

        </section>

         </main>

    <!-- JavaScript -->
    <script src="./assets/js/product.js"></script>

</body>

</html>
